apiVersion: v1
kind: Service
metadata:
  name: {{ include "meterforge.componentName" (list . "api") }}
  labels:
    {{- include "meterforge.componentLabels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meterforge.componentSelectorLabels" (list . "api") | nindent 4 }}
