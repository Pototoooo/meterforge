apiVersion: v1
kind: Secret
metadata:
  name: {{ include "benthos-collector.fullname" . }}
  labels:
    {{- include "benthos-collector.labels" . | nindent 4 }}
type: Opaque
data:
  METERFORGE_URL: {{ required "MeterForge URL is required" .Values.meterforge.url | b64enc | quote }}
  {{- with .Values.meterforge.token }}
  METERFORGE_TOKEN: {{ . | b64enc | quote }}
  {{- end }}


---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "benthos-collector.componentName" (list . "config") }}
  labels:
    {{- include "benthos-collector.labels" . | nindent 4 }}
type: Opaque
data:
  config.yaml: {{ .Values.config | toYaml | b64enc | quote }}
