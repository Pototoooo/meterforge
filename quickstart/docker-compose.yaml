# please use port numbers in the 40000 range so that it doesn't conflict with the main dev environment
x-meterforge-worker-healthcheck: &meterforge-worker-healthcheck
  test: ["CMD", "wget", "--spider", "http://localhost:10000/healthz"]
  interval: 5s
  timeout: 3s
  retries: 30

services:
  meterforge:
    image: ghcr.io/Pototoooo/meterforge:latest
    command: meterforge --address 0.0.0.0:8888 --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:48888:8888"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://meterforge:8888/api/v1/debug/metrics"]
      interval: 5s
      timeout: 3s
      retries: 30

  console:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: always
    depends_on:
      meterforge:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  sink-worker:
    image: ghcr.io/Pototoooo/meterforge:latest
    command: meterforge-sink-worker --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      meterforge:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:40000:10000"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
    healthcheck: *meterforge-worker-healthcheck

  balance-worker:
    image: ghcr.io/Pototoooo/meterforge:latest
    command: meterforge-balance-worker --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      meterforge:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:40001:10000"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
    healthcheck: *meterforge-worker-healthcheck

  notification-service:
    image: ghcr.io/Pototoooo/meterforge:latest
    command: meterforge-notification-service --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      meterforge:
        condition: service_healthy
    ports:
      - "127.0.0.1:40002:10000"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
    healthcheck: *meterforge-worker-healthcheck

  billing-worker:
    image: ghcr.io/Pototoooo/meterforge:latest
    command: meterforge-billing-worker --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      meterforge:
        condition: service_healthy
    ports:
      - "127.0.0.1:40003:10000"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
    healthcheck: *meterforge-worker-healthcheck

  meterforge-jobs:
    image: ghcr.io/Pototoooo/meterforge:latest
    command: meterforge-jobs --config /etc/meterforge/config.yaml quickstart cron
    restart: always
    pull_policy: never
    depends_on:
      meterforge:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml

  kafka:
    extends:
      file: ../docker-compose.base.yaml
      service: kafka

  clickhouse:
    extends:
      file: ../docker-compose.base.yaml
      service: clickhouse

  redis:
    extends:
      file: ../docker-compose.base.yaml
      service: redis

  postgres:
    extends:
      file: ../docker-compose.base.yaml
      service: postgres

  svix:
    extends:
      file: ../docker-compose.base.yaml
      service: svix

configs:
  svix_sql:
    content: |
      CREATE USER svix WITH PASSWORD 'svix';
      CREATE DATABASE svix;
      GRANT ALL PRIVILEGES ON DATABASE svix TO svix;
      ALTER DATABASE svix OWNER TO svix;
