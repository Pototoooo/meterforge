# Note: this can only be started using
#  docker compose -f docker-compose.infra.yaml -f docker-compose.meterforge.yaml up
#
# Given this is governed by the Makefile, it's fine to not to add all the extends here.
services:
  meterforge:
    command: meterforge --address 0.0.0.0:8888 --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:38888:8888"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
      - ./logs/meterforge:/var/log/meterforge/
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://meterforge:8888/api/v1/debug/metrics"]
      interval: 5s
      timeout: 3s
      retries: 30

  sink-worker:
    command: meterforge-sink-worker --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      meterforge:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:30000:10000"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
      - ./logs/sink-worker:/var/log/meterforge

  billing-worker:
    command: meterforge-billing-worker --config /etc/meterforge/config.yaml
    restart: always
    pull_policy: always
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meterforge:
        condition: service_healthy
    ports:
      - "127.0.0.1:30001:10000"
    volumes:
      - ./config.yaml:/etc/meterforge/config.yaml
      - ./logs/billing-worker:/var/log/meterforge
