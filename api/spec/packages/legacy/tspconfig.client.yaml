emit:
  - '@typespec/http-client-python'
parameters:
  base-dir:
    default: '{cwd}'
  client-dir:
    default: '{cwd}/../../../client'
output-dir: '{base-dir}'
options:
  '@typespec/http-client-python':
    emitter-output-dir: '{client-dir}/python'
    package-name: meterforge
    generation-subdir: _generated
    namespace: meterforge
    package-version: '0.0.0'
    generate-packaging-files: false
linter:
  extends:
    - '@meterforge/api-spec-legacy/all'
