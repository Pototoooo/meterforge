emit:
  - '@typespec/openapi3'
  - '@meterforge/typespec-typescript'
  - '@meterforge/typespec-go'
parameters:
  base-dir:
    default: '{cwd}'
output-dir: '{base-dir}'
options:
  '@typespec/openapi3':
    emitter-output-dir: '{output-dir}/output/definitions/metering-and-billing/v3'
    omit-unreachable-types: true
    seal-object-schemas: true
  '@meterforge/typespec-typescript':
    emitter-output-dir: '{output-dir}/../aip-client-javascript'
    # The npm package name the generated README installs and imports.
    package-name: '@meterforge/client'
    # Markdown callout inserted after the README intro.
    readme-note: |
      > **Important:** This SDK is a work in progress.
      >
      > This SDK targets the [MeterForge API v3](https://github.com/Pototoooo/meterforge/tree/main/docs/api/v3),
      > a rewrite of the MeterForge API following AIP (API Improvement Proposal)
      > standardization.
    # Emit per-operation schemas only for the MeterForge service.
    include-services:
      - 'MeterForge'
    # Mirror the TS SDK prefix stripping so the Zod schemas match.
    strip-name-prefixes:
      - 'Billing'
      - 'MeterForge'
      - 'Metering'
  '@meterforge/typespec-go':
    emitter-output-dir: '{output-dir}/../../../v3/client'
    # Go module path (the published import identity, independent of where the client is generated in the repo).
    module-path: 'github.com/Pototoooo/meterforge/api/v3/client'
    # Go package name; deliberately differs from the module path's last segment
    # (same precedent as api/client/go), goimports resolves it.
    package-name: 'meterforge'
    # Markdown callout inserted after the README intro.
    readme-note: |
      > [!IMPORTANT]
      > This SDK is a work in progress.
      >
      > This SDK targets the [MeterForge API v3](https://github.com/Pototoooo/meterforge/tree/main/docs/api/v3),
      > a rewrite of the MeterForge API following AIP (API Improvement Proposal)
      > standardization.
    include-services:
      - 'MeterForge'
    strip-name-prefixes:
      - 'Billing'
      - 'MeterForge'
      - 'Metering'
    go-version: '1.24'
linter:
  extends:
    - '@meterforge/api-spec-aip/all'
